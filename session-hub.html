<title>Badgers Session Hub</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail of sections, one scrolling column of cards; every time is a dual-zone chip (Prague 24h / Madison 12h). */
:root{
  --bg:#faf8f7; --surface:#ffffff; --surface-2:#f3f0ee; --line:#e4dfdb;
  --fg:#1b1716; --fg-muted:#6f6662; --fg-faint:#9b928d;
  --accent:#a8211f; --accent-soft:#fbeceb; --accent-line:#efcfcd;
  --good:#1c7550; --good-soft:#e7f4ee;
  --warn:#8d5c00; --warn-soft:#fbf0db;
  --info:#2d5a9e; --info-soft:#e9effa;
  --display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(27,23,22,.06), 0 6px 18px rgba(27,23,22,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141211; --surface:#1d1b1a; --surface-2:#262322; --line:#363230;
    --fg:#f2efed; --fg-muted:#a69e99; --fg-faint:#7d7571;
    --accent:#f2726d; --accent-soft:#38201f; --accent-line:#55302e;
    --good:#52c48d; --good-soft:#15291f;
    --warn:#dca63f; --warn-soft:#2b2214;
    --info:#7ea7e8; --info-soft:#17212f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141211; --surface:#1d1b1a; --surface-2:#262322; --line:#363230;
  --fg:#f2efed; --fg-muted:#a69e99; --fg-faint:#7d7571;
  --accent:#f2726d; --accent-soft:#38201f; --accent-line:#55302e;
  --good:#52c48d; --good-soft:#15291f;
  --warn:#dca63f; --warn-soft:#2b2214;
  --info:#7ea7e8; --info-soft:#17212f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- demo strip ---------- */
.demo{background:var(--fg);color:var(--bg)}
.demo-in{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:8px;max-width:1240px;margin:0 auto;font-size:12.5px}
.demo b{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;opacity:.65}
.roles{display:flex;gap:4px;background:rgba(127,127,127,.25);padding:3px;border-radius:999px}
.roles button{background:none;border:0;padding:4px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:500;opacity:.8}
.roles button[aria-pressed="true"]{background:var(--bg);color:var(--fg);opacity:1}
.demo .clock{margin-left:auto;display:flex;gap:14px;font-variant-numeric:tabular-nums;opacity:.85}

/* ---------- header ---------- */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1240px;margin:0 auto;padding-block:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.mark .dot{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;flex:none}
.mark h1{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark span{display:block;font-family:var(--body);font-size:12px;color:var(--fg-muted);font-weight:400}
.whoami{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fg-muted)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:600;font-family:var(--display);color:var(--fg);flex:none}

/* ---------- shell ---------- */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:208px minmax(0,1fr);gap:28px;padding-block:22px 64px;align-items:start}
nav.rail{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
nav.rail button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--fg-muted);font-size:14px;font-weight:500}
nav.rail button:hover{background:var(--surface-2);color:var(--fg)}
nav.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.rail .count{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;font-weight:600;font-variant-numeric:tabular-nums}
nav.rail .ico{width:16px;text-align:center;opacity:.8;flex:none}
main{min-width:0;display:flex;flex-direction:column;gap:18px}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 56px}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;scrollbar-width:thin}
  nav.rail button{width:auto;white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
  nav.rail .ico{display:none}
  .demo .clock{margin-left:0;width:100%}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.card>.hd h2{font-size:14px;font-weight:600}
.card>.hd .sub{font-size:12.5px;color:var(--fg-muted)}
.card>.bd{padding:16px}
.card>.bd.tight{padding:0}
.eyebrow{font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-faint)}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h h2{font-size:22px;font-weight:700}
.page-h p{font-size:13.5px;color:var(--fg-muted)}
.muted{color:var(--fg-muted)}
.faint{color:var(--fg-faint)}
.sm{font-size:13px}
.xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--fg-muted);padding:6px 8px}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2.5px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.pill.open{background:var(--surface-2);color:var(--fg-muted);border-color:var(--line)}
.pill.booked{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--surface-2);color:var(--fg-faint);border-color:var(--line)}

input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:13.5px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg-muted);font-weight:500;min-width:0}

/* ---------- slots ---------- */
.slot{display:grid;grid-template-columns:168px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot.mine{background:var(--accent-soft)}
.slot .when{min-width:0}
.slot .when .big{font-family:var(--display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.slot .when .alt{font-size:12px;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.slot .mid{min-width:0;display:flex;flex-direction:column;gap:3px}
.slot .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:700px){
  .slot{grid-template-columns:minmax(0,1fr);gap:8px}
  .slot .acts{justify-content:flex-start}
}
.zone{display:inline-flex;gap:5px;align-items:baseline}
.zone .tag{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-faint);font-family:var(--display)}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it.click{cursor:pointer}
.list .it.click:hover{background:var(--surface-2)}
.it .grow{flex:1;min-width:0}
.it .nm{font-weight:600;font-size:14px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- stats ---------- */
.stat{background:var(--surface-2);border-radius:9px;padding:12px 14px;border:1px solid var(--line)}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--fg-muted);margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px;padding:16px;max-height:440px;overflow-y:auto}
.msg{max-width:min(78%,480px);display:flex;flex-direction:column;gap:3px}
.msg .bub{padding:9px 12px;border-radius:12px;font-size:14px;border:1px solid var(--line);background:var(--surface-2)}
.msg .meta{font-size:11px;color:var(--fg-faint)}
.msg.them{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--accent);border-color:var(--accent);color:#fff}
.attach{display:flex;align-items:center;gap:8px;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px}
.msg.me .attach{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.composer{display:flex;gap:8px;align-items:flex-end;padding:12px 16px;border-top:1px solid var(--line)}

/* ---------- misc ---------- */
.note{display:flex;gap:9px;padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.45}
.note.info{background:var(--info-soft);color:var(--info)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.accent{background:var(--accent-soft);color:var(--accent)}
.note b{font-weight:600}
table.mx{width:100%;border-collapse:collapse;font-size:13px}
table.mx th,table.mx td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.mx th{font-family:var(--display);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-faint);font-weight:600}
table.mx td.c{text-align:center}
.scrollx{overflow-x:auto}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;flex:none}
.steps{display:grid;gap:10px;counter-reset:s}
.step{display:grid;grid-template-columns:24px 1fr;gap:11px;align-items:start}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px}
/* ---------- week grid ---------- */
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav .lbl{font-family:var(--display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.day{background:var(--surface);padding:10px 7px;display:flex;flex-direction:column;gap:7px;min-height:124px}
.day.off{background:var(--surface-2)}
.day .dh{text-align:center}
.day .dh .dw{font-family:var(--display);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-faint)}
.day .dh .dd{font-family:var(--display);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.day .slots{display:flex;flex-direction:column;gap:6px}
.day .none{font-size:11px;color:var(--fg-faint);text-align:center;margin-top:4px}
.chip{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--surface-2);font-size:12.5px;line-height:1.3;cursor:default}
.chip .t{font-weight:600;font-variant-numeric:tabular-nums;display:block}
.chip .s{font-size:10.5px;color:var(--fg-muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.free{background:var(--good-soft);border-color:transparent;color:var(--good);cursor:pointer;transition:background .12s,color .12s}
.chip.free .s{color:var(--good);opacity:.8}
.chip.free:hover,.chip.free:focus-visible{background:var(--good);color:#fff}
.chip.free:hover .s,.chip.free:focus-visible .s{color:#fff;opacity:.85}
.chip.mine{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer}
.chip.mine .s{color:#fff;opacity:.85}
.chip.past{opacity:.5}
@media (max-width:760px){
  .week{grid-template-columns:minmax(0,1fr)}
  .day{min-height:0;flex-direction:row;align-items:center;gap:12px;padding:10px 14px}
  .day.off{display:none}
  .day .dh{display:flex;gap:7px;align-items:baseline;width:72px;flex:none;text-align:left}
  .day .dh .dd{font-size:15px}
  .day .slots{flex:1;flex-direction:row;flex-wrap:wrap;min-width:0}
  .chip{width:auto;flex:1 1 140px}
}
/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,9,9,.5);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.3);max-width:410px;width:100%;overflow:hidden}
.modal .mb{padding:20px}
.modal .big{font-family:var(--display);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:8px}
.modal .ft{display:flex;gap:8px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;box-shadow:var(--shadow);z-index:60;transition:opacity .2s, transform .2s;pointer-events:none}
#toast[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ============================= time ============================= */
const TZ_CZ = 'Europe/Prague', TZ_US = 'America/Chicago';

function offsetMin(date, tz){
  const p = {};
  for (const part of new Intl.DateTimeFormat('en-GB',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(date)) p[part.type]=part.value;
  const asUTC = Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute, +p.second);
  return Math.round((asUTC - date.getTime())/60000);
}
/* wall-clock time in a zone -> real instant */
function zonedToUTC(y,m,d,hh,mi,tz){
  let ts = Date.UTC(y,m-1,d,hh,mi);
  for (let i=0;i<2;i++) ts = Date.UTC(y,m-1,d,hh,mi) - offsetMin(new Date(ts),tz)*60000;
  return new Date(ts).toISOString();
}
function gapHours(iso){ const d=new Date(iso); return (offsetMin(d,TZ_CZ)-offsetMin(d,TZ_US))/60; }
const f = (iso,tz,o)=>new Intl.DateTimeFormat('en-US',{timeZone:tz,...o}).format(new Date(iso));
const czTime = iso => f(iso,TZ_CZ,{hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const usTime = iso => f(iso,TZ_US,{hour:'numeric',minute:'2-digit',hour12:true});
const czDay  = iso => f(iso,TZ_CZ,{weekday:'short',day:'numeric',month:'short'});
const usDay  = iso => f(iso,TZ_US,{weekday:'short',day:'numeric',month:'short'});
const endOf  = (iso,min)=>new Date(new Date(iso).getTime()+min*60000).toISOString();

/* calendar-date helpers, used to lay a week out in the viewer's own zone */
function ymd(iso,tz){
  const p={}; for(const x of new Intl.DateTimeFormat('en-GB',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(iso))) p[x.type]=x.value;
  return {y:+p.year,m:+p.month,d:+p.day};
}
const addDays=(o,n)=>{const t=new Date(Date.UTC(o.y,o.m-1,o.d+n));return{y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()}};
const mondayOf=o=>addDays(o,-((new Date(Date.UTC(o.y,o.m-1,o.d)).getUTCDay()+6)%7));
const dayKey=o=>`${o.y}-${String(o.m).padStart(2,'0')}-${String(o.d).padStart(2,'0')}`;
const dayStart=(o,tz)=>+new Date(zonedToUTC(o.y,o.m,o.d,0,0,tz));
const calFmt=(o,opt)=>new Intl.DateTimeFormat('en-US',{timeZone:'UTC',...opt}).format(new Date(Date.UTC(o.y,o.m-1,o.d)));

/* ============================= sample data ============================= */
/* Roster below is placeholder data for the prototype, not real athletes. */
const ME = {admin:'u_mi', player:'p1', coach:'c1'};

const people = [
  {id:'u_mi', role:'admin',  first:'Michal', last:'Cipro',     email:'michal@winningminds.cz', status:'active'},
  {id:'u_ml', role:'admin',  first:'Milan',  last:'Dvořák',    email:'milan@winningminds.cz',  status:'active'},
  {id:'c1',   role:'coach',  first:'Dana',   last:'Reiss',     email:'d.reiss@badgers.example',status:'active', title:'Head coach'},
  {id:'p1',   role:'player', first:'Emma',   last:'Kowalski',  email:'ekowalski@wisc.example', status:'active', year:'Jr'},
  {id:'p2',   role:'player', first:'Sofia',  last:'Marín',     email:'smarin@wisc.example',    status:'active', year:'So'},
  {id:'p3',   role:'player', first:'Lucia',  last:'Vrba',      email:'lvrba@wisc.example',     status:'active', year:'Sr'},
  {id:'p4',   role:'player', first:'Nora',   last:'Hensley',   email:'nhensley@wisc.example',  status:'active', year:'Fr'},

function dual(iso, lead){ /* lead: 'cz' | 'us' */
  const a = lead==='cz' ? {d:czDay(iso), t:czTime(iso), tag:'Prague'} : {d:usDay(iso), t:usTime(iso), tag:'Madison'};
  const b = lead==='cz' ? {t:usTime(iso), tag:'Madison'} : {t:czTime(iso), tag:'Prague'};
  return `<div class="when">
    <div class="big">${a.d} · ${a.t}</div>
    <div class="alt"><span class="zone"><span class="tag">${b.tag}</span>${b.t}</span> <span class="faint">· ${a.tag} time above</span></div>
  </div>`;
}
function gapBanner(cyc){
  const s = slots.filter(x=>x.cycle===cyc)[0]; if(!s) return '';
  const g = gapHours(s.at);
  if (g===7) return '';
  return `<div class="note warn"><span>⚠</span><div><b>Clock gap is ${g} hours this cycle, not the usual 7.</b> The EU set clocks back on Oct 25, the US does it on Nov 1. Every time below is already converted — never re-count by hand during these two weeks.</div></div>`;
}
function cycleTabs(){
  return `<div class="row">`+cycles.map(c=>{

/* ============================= PLAYER ============================= */
/* Draft cycles never reach a player. */
const playerSlots = () => slots.filter(s=>{const c=cycles.find(c=>c.id===s.cycle); return c && c.status!=='draft';});
const weekKeys = () => [...new Set(playerSlots().map(s=>dayKey(mondayOf(ymd(s.at,TZ_US)))))].sort();
function ensureWeek(){
  if (state.week) return;
  const next = playerSlots().filter(s=>cycles.find(c=>c.id===s.cycle).status==='open').sort((a,b)=>a.at<b.at?-1:1)[0];
  state.week = mondayOf(ymd(next ? next.at : new Date().toISOString(), TZ_US));
}
function chip(s){
  const done = cycles.find(c=>c.id===s.cycle).status==='done';
  const ttl = `${czTime(s.at)} in Prague`;
  if (s.who===ME.player)
    return `<button class="chip mine" title="${ttl}" data-act="askrelease" data-v="${s.id}"><span class="t">${usTime(s.at)}</span><span class="s">${done?'Attended':'Your slot — tap to release'}</span></button>`;
  if (s.who)
    return `<div class="chip taken ${done?'past':''}" title="${ttl}"><span class="t">${usTime(s.at)}</span><span class="s">${esc(short(s.who))}</span></div>`;
  if (done)
    return `<div class="chip past" title="${ttl}"><span class="t">${usTime(s.at)}</span><span class="s">Not used</span></div>`;
  return `<button class="chip free" title="${ttl}" data-act="askbook" data-v="${s.id}"><span class="t">${usTime(s.at)}</span><span class="s">Free · ${s.dur} min</span></button>`;
}
function weekGrid(){
  ensureWeek();
  const mon = state.week, days = [...Array(7)].map((_,i)=>addDays(mon,i));
  const from = dayStart(mon,TZ_US), to = dayStart(addDays(mon,7),TZ_US);
  const inWeek = playerSlots().filter(s=>{const t=+new Date(s.at); return t>=from && t<to;}).sort((a,b)=>a.at<b.at?-1:1);
  const free = inWeek.filter(s=>!s.who && cycles.find(c=>c.id===s.cycle).status==='open').length;
  const cycNames = [...new Set(inWeek.map(s=>s.cycle))].map(id=>{const c=cycles.find(x=>x.id===id);return `<span class="pill ${c.status==='open'?'booked':'done'}">Cycle ${c.n}</span>`;}).join('');
  const label = `${calFmt(mon,{month:'short',day:'numeric'})} – ${calFmt(addDays(mon,6),{month:'short',day:'numeric'})}`;
  const keys = weekKeys(), here = dayKey(mon);
  const prev = keys.filter(k=>k<here).pop(), next = keys.find(k=>k>here);

  return `<div class="card">
    <div class="hd">
      <div class="weeknav">
        <button class="btn sm" data-act="week" data-v="-1" aria-label="Previous week">←</button>
        <span class="lbl">${label}</span>
        <button class="btn sm" data-act="week" data-v="1" aria-label="Next week">→</button>
      </div>
      ${cycNames}
      <span class="sub" style="margin-left:auto">${free?`${free} free slot${free>1?'s':''} this week`:'No free slots this week'}</span>
    </div>
    ${inWeek.length ? `<div class="week">${days.map(d=>{
      const ds = dayStart(d,TZ_US), de = dayStart(addDays(d,1),TZ_US);
      const list = inWeek.filter(s=>{const t=+new Date(s.at); return t>=ds && t<de;});
      return `<div class="day ${list.length?'':'off'}">
        <div class="dh"><div class="dw">${calFmt(d,{weekday:'short'})}</div><div class="dd">${d.d}</div></div>
        ${list.length?`<div class="slots">${list.map(chip).join('')}</div>`:`<div class="none">—</div>`}
      </div>`;
    }).join('')}</div>` : `<div class="bd" style="text-align:center">
        <p class="sm muted">No sessions this week.</p>
        ${next||prev?`<button class="btn sm" style="margin-top:10px" data-act="weekjump" data-v="${next||prev}">Go to ${next?'the next':'the last'} cycle</button>`:''}
      </div>`}
    <div class="bd" style="border-top:1px solid var(--line)">
      <p class="xs muted">Tap a green slot to take it — you confirm once and you are booked. Times are yours (Madison); hover a slot to see the Prague time. Teammates see only each other's names, never notes, messages, files or tasks.</p>
    </div>
  </div>`;
}
function modal(){
  if (!state.confirm) return '';
  const s = slots.find(x=>x.id===state.confirm.id); if (!s) return '';
  const book = state.confirm.type==='book';
  const cur = book ? slots.find(x=>x.cycle===s.cycle && x.who===ME.player) : null;
  return `<div class="scrim" data-act="closem"><div class="modal" role="dialog" aria-modal="true" aria-label="${book?'Confirm booking':'Release slot'}">
    <div class="mb">
      <div class="eyebrow">${book?'Confirm your slot':'Release this slot?'}</div>
      <div class="big">${usDay(s.at)} · ${usTime(s.at)}</div>
      <p class="sm muted num" style="margin-top:5px">${s.dur} minutes · ${czTime(s.at)} in Prague</p>
      ${book && cur ? `<div class="note warn" style="margin-top:14px"><span>⚠</span><div>This replaces your current slot on <b>${usDay(cur.at)} at ${usTime(cur.at)}</b>.</div></div>`
        : book ? `<p class="sm muted" style="margin-top:12px">You will get an email confirmation and the Google Meet link appears here on the day.</p>`
        : `<p class="sm muted" style="margin-top:12px">It goes back into the pool and a teammate can take it.</p>`}
    </div>
    <div class="ft">
      <button class="btn" data-act="closem">Cancel</button>
      <button class="btn primary" data-act="${book?'dobook':'dorelease'}" data-v="${s.id}">${book?'Confirm booking':'Release'}</button>
    </div>
  </div></div>`;
}

/* ============================= chat ============================= */
function chatBlock(who, side){
  const t = thread(who);
  const meId = ME[state.role];
  return `<div class="chat" id="chat">
    ${t.msgs.map(m=>{
      const mine = (side==='wm') ? P(m.from).role==='admin' : m.from===meId;
      const fl = m.file ? files.find(x=>x.id===m.file) : null;
      return `<div class="msg ${mine?'me':'them'}">
        <div class="bub">${esc(m.text)}${fl?`<div class="attach">📎 <span class="trunc">${esc(fl.name)}</span><span class="xs" style="opacity:.75">${esc(fl.size)}</span></div>`:''}</div>
        <div class="meta num">${esc(P(m.from).first)} · ${state.role==='player'?usTime(m.at)+' '+usDay(m.at):czTime(m.at)+' '+czDay(m.at)}</div>

/* ============================= render ============================= */
function render(){
  const meId = ME[state.role], me = P(meId);
  document.getElementById('who-name').textContent =
    state.role==='admin' ? me.first+' · Winning Minds' :
    state.role==='coach' ? me.first+' '+me.last+' · Coach' : me.first+' '+me.last+' · Player';
  document.getElementById('who-av').textContent = inits(meId);
  document.querySelectorAll('[data-act="role"]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===state.role)));

  const views = VIEWS[state.role];
  if (!views.some(v=>v[0]===state.view)) state.view = views[0][0];
  document.getElementById('rail').innerHTML = views.map(([id,label,ico])=>{
    const n = id==='today' ? pendingCount() : 0;
    return `<button data-act="go" data-v="${id}" ${state.view===id?'aria-current="page"':''}><span class="ico">${ico}</span>${label}${n?`<span class="count num">${n}</span>`:''}</button>`;
  }).join('');

  const map = {
    'admin:today':vToday,'admin:schedule':vSchedule,'admin:people':vPeople,'admin:messages':vMessages,'admin:library':vLibrary,'admin:setup':vSetup,
    'player:home':vHome,'player:messages':vMessages,'player:tasks':vTasks,'player:library':vLibrary,
    'coach:team':vTeam,'coach:messages':vMessages,
  };
  document.getElementById('main').innerHTML = (map[state.role+':'+state.view]||(()=>''))() + (state.role==='player'?modal():'');
  const c = document.getElementById('chat'); if (c) c.scrollTop = c.scrollHeight;
  previewSlot();
}

function previewSlot(){
  const d = document.getElementById('ns-date'), t = document.getElementById('ns-time'), out = document.getElementById('ns-preview');
  if (!d||!t||!out) return;
  const [y,m,dd]=d.value.split('-').map(Number), [hh,mi]=t.value.split(':').map(Number);
  if (!y||!hh&&hh!==0) { out.textContent='—'; return; }
  const iso = zonedToUTC(y,m,dd,hh,mi,TZ_CZ);
  out.innerHTML = `<b>${czDay(iso)} ${czTime(iso)}</b> in Prague is <b>${usDay(iso)} ${usTime(iso)}</b> in Madison — ${gapHours(iso)} hours apart that week.`;
}

/* ============================= actions ============================= */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, v = el.dataset.v;

  if (a==='role'){ state.role=v; state.open=null; state.confirm=null; state.view=VIEWS[v][0][0]; render(); return; }
  if (a==='go'){ state.view=v; state.open=null; state.confirm=null; render(); return; }
  if (a==='cycle'){ state.cycle=v; render(); return; }
  if (a==='openp'){ state.open=v; state.view='people'; render(); return; }
  if (a==='closep'){ state.open=null; render(); return; }
  if (a==='chat'){ state.chat=v; state.view='messages'; state.open=null; render(); return; }

  if (a==='approve'){ const p=P(v); const sel=document.querySelector(`[data-act="setrole"][data-v="${v}"]`); if(sel) p.role=sel.value; p.status='active'; toast(p.first+' approved — they can sign in now'); render(); return; }
  if (a==='decline'){ const p=P(v); p.status='declined'; people.splice(people.indexOf(p),1); toast('Request declined'); render(); return; }

  if (a==='week'){ state.week=addDays(state.week, 7*(+v)); render(); return; }
  if (a==='weekjump'){ const [y,m,d]=v.split('-').map(Number); state.week={y,m,d}; render(); return; }
  if (a==='askbook'){ state.confirm={type:'book', id:v}; render(); return; }
  if (a==='askrelease'){ state.confirm={type:'release', id:v}; render(); return; }
  if (a==='closem'){ if (el.classList.contains('scrim') && e.target!==el) return; state.confirm=null; render(); return; }
  if (a==='dobook'){ const s=slots.find(x=>x.id===v);
    const prev=slots.find(x=>x.cycle===s.cycle && x.who===ME.player); if(prev) prev.who=null;
    s.who=ME.player; state.confirm=null; toast('Booked · '+usDay(s.at)+' at '+usTime(s.at)); render(); return; }
  if (a==='dorelease'){ const s=slots.find(x=>x.id===v); s.who=null; state.confirm=null; toast('Slot released — pick another one'); render(); return; }

  if (a==='book'){ const s=slots.find(x=>x.id===v);
    const prev = slots.find(x=>x.cycle===s.cycle && x.who===ME.player); if(prev) prev.who=null;
    s.who=ME.player; toast('Booked · '+usDay(s.at)+' '+usTime(s.at)); render(); return; }
  if (a==='release'){ const s=slots.find(x=>x.id===v); const n=s.who?P(s.who).first:''; s.who=null; toast(state.role==='player'?'Slot released — pick another one':'Released '+n+"'s slot"); render(); return; }

  if (a==='savelink'){ const inp=document.querySelector(`[data-link="${v}"]`); const s=slots.find(x=>x.id===v);
    if(!inp.value.trim()){ toast('Paste a Meet link first'); return; } s.meet=inp.value.trim(); toast('Link saved'); render(); return; }
  if (a==='copy'){ const s=slots.find(x=>x.id===v);
    (navigator.clipboard?.writeText(s.meet)||Promise.reject()).then(()=>toast('Link copied')).catch(()=>toast(s.meet)); return; }
  if (a==='delslot'){ slots.splice(slots.findIndex(x=>x.id===v),1); toast('Slot removed'); render(); return; }
  if (a==='addslot'){
    const d=document.getElementById('ns-date').value, t=document.getElementById('ns-time').value;
    if(!d||!t){ toast('Pick a date and time'); return; }
    const [y,m,dd]=d.split('-').map(Number), [hh,mi]=t.split(':').map(Number);
    slots.push({id:'s'+(++slotSeq), cycle:state.cycle, at:zonedToUTC(y,m,dd,hh,mi,TZ_CZ),
      dur:+document.getElementById('ns-dur').value||45, meet:document.getElementById('ns-meet').value.trim(), who:null});
    toast('Slot added'); render(); return; }
  if (a==='publish'){ const c=cycles.find(x=>x.id===v); c.status='open'; c.note='Booking open'; toast('Players can now book Cycle '+c.n); render(); return; }
  if (a==='nudge'){ toast('Reminder emailed to players without a slot'); return; }
  if (a==='join'){ toast('Opens 10 minutes before the call'); return; }
  if (a==='dl'){ toast('Opens in the real app'); return; }
  if (a==='attach'){ toast('File picker — attaches to this message'); return; }

  if (a==='send'){ const ta=document.getElementById('cm'); const txt=ta.value.trim(); if(!txt){ta.focus();return;}
    thread(v).msgs.push({from:ME[state.role], at:new Date().toISOString(), text:txt}); render(); return; }

  if (a==='addnote'){ const ta=document.getElementById('np-note'); const txt=ta.value.trim(); if(!txt){ta.focus();return;}
    notes.unshift({id:'n'+Date.now(), who:v, at:'2026-10-18', by:ME.admin, text:txt}); toast('Note saved'); render(); return; }
  if (a==='addtask'){ const i=document.getElementById('np-task'); const txt=i.value.trim(); if(!txt){i.focus();return;}
    tasks.push({id:'t'+Date.now(), who:v, title:txt, due:document.getElementById('np-due').value, done:false, by:ME.admin});
    toast('Task assigned to '+P(v).first); render(); return; }
  if (a==='upload'){ const n=document.getElementById('up-name').value.trim(); if(!n){toast('Give the file a name');return;}
    files.unshift({id:'f'+Date.now(), name:n, size:'—', by:ME.admin, at:'2026-10-18', to:document.getElementById('up-to').value});
    toast('File added'); render(); return; }
});

document.addEventListener('change', e=>{
  const el = e.target.closest('[data-act="task"]'); if(!el) return;
  const t = tasks.find(x=>x.id===el.dataset.v); t.done = el.checked;
  toast(t.done?'Marked done':'Reopened'); render();
});
document.addEventListener('input', e=>{ if(e.target.id==='ns-date'||e.target.id==='ns-time') previewSlot(); });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && state.confirm){ state.confirm=null; render(); return; }
  if(e.target.id==='cm' && e.key==='Enter' && !e.shiftKey){ e.preventDefault();
    document.querySelector('[data-act="send"]')?.click(); }
});

clocks(); setInterval(clocks, 20000);
render();
</script>
